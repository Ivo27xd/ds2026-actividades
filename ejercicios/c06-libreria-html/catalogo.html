<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Catálogo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" id="navbar">
        <div class="container-fluid">
    
            <!-- titulo con ícono -->
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-book" id="icono-libro"></i> Mi Librería
            </a>

            <!-- menú hamburguesa para mobile (se puede ver achicando la ventana) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- links -->
            <div class="collapse navbar-collapse ms-auto" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<section id="buscador-catalogo" class="py-5">

    <div class="container">

        <!-- Título -->
        <div class="text-center mb-5">

            <h1 class="titulo-catalogo">
                Explorá el catálogo
            </h1>

            <p class="subtitulo-catalogo">
                Descubrí historias, autores y mundos nuevos.
            </p>

        </div>

        <!-- Buscador -->
        <div class="buscador-container">

            <input
                type="text"
                id="input"
                placeholder="Buscar libros..."
            >

            <button
                class="btn-principal"
                id="btnBuscar"
            >
                Buscar
            </button>

        </div>

        <!-- Estados -->
        <p id="loading" class="texto-estado">
            Cargando...
        </p>

        <p id="error" class="texto-error"></p>

        <!-- Resultados -->
        <div id="resultados" class="mt-5"></div>

    </div>

</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
</body>
</html>
